version: "3.8"

networks:
  ticket_network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

services:
  # ========================================================
  # 1. Cơ sở dữ liệu PostgreSQL 16
  # ========================================================
  db:
    image: postgres:16.4-alpine3.20
    container_name: ticket_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ticket_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-TicketSecureDevPassword2026!}
      POSTGRES_DB: ${POSTGRES_DB:-ticket_booking_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ticket_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ticket_user} -d ${POSTGRES_DB:-ticket_booking_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ========================================================
  # 2. Redis Cache 7
  # ========================================================
  redis:
    image: redis:7.4.0-alpine3.20
    container_name: ticket_redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-RedisSecureDevPassword2026!}"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - ticket_network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-RedisSecureDevPassword2026!}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s

  # ========================================================
  # 3. Migration Runner (Chạy 1 lần trước khi Backend start)
  # ========================================================
  migration:
    build:
      context: ./src/backend
      dockerfile: TicketBooking.Api/Dockerfile
    container_name: ticket_migration
    restart: "no"
    command: ["dotnet", "TicketBooking.Api.dll", "--migrate-database"]
    environment:
      ConnectionStrings__DefaultConnection: Host=db;Port=5432;Database=${POSTGRES_DB:-ticket_booking_db};Username=${POSTGRES_USER:-ticket_user};Password=${POSTGRES_PASSWORD:-TicketSecureDevPassword2026!};Timeout=15
    networks:
      - ticket_network
    depends_on:
      db:
        condition: service_healthy

  # ========================================================
  # 4. Backend (ASP.NET Core 8 Web API)
  # ========================================================
  backend:
    build:
      context: ./src/backend
      dockerfile: TicketBooking.Api/Dockerfile
    container_name: ticket_backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__DefaultConnection: Host=db;Port=5432;Database=${POSTGRES_DB:-ticket_booking_db};Username=${POSTGRES_USER:-ticket_user};Password=${POSTGRES_PASSWORD:-TicketSecureDevPassword2026!};Timeout=15
      ConnectionStrings__Redis: redis:6379,password=${REDIS_PASSWORD:-RedisSecureDevPassword2026!},abortConnect=false
    networks:
      - ticket_network
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://127.0.0.1:5000/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ========================================================
  # 5. Frontend (React 18 + Vite + Nginx)
  # ========================================================
  frontend:
    build:
      context: ./src/frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ""
    container_name: ticket_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    networks:
      - ticket_network
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
