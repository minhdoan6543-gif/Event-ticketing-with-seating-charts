name: Deploy Staging

on:
  push:
    branches: [main]

# Ngăn chặn hai tiến trình deploy chạy chồng chéo nhau lên staging cùng lúc
concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  # ============================================================================
  # 1. Build & Push Docker Images gắn thẻ Commit SHA lên GitHub Container Registry
  # ============================================================================
  build-and-push:
    name: "Build & Push Docker Images"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.vars.outputs.sha_short }}
    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Khởi tạo biến định danh (Commit SHA ngắn)
        id: vars
        run: |
          echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "image_tag=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Đăng nhập vào GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Thiết lập Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build & Push Backend
      - name: Build & Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./src/backend
          file: ./src/backend/TicketBooking.Api/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/backend:${{ steps.vars.outputs.sha_short }}
            ghcr.io/${{ github.repository }}/backend:staging
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Build & Push Frontend
      - name: Build & Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./src/frontend
          file: ./src/frontend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/frontend:${{ steps.vars.outputs.sha_short }}
            ghcr.io/${{ github.repository }}/frontend:staging
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================================
  # 2. Triển khai Blue-Green Zero-Downtime lên máy chủ Linux Staging qua SSH
  # ============================================================================
  deploy:
    name: "Deploy Blue-Green to Staging Host"
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Cài đặt và cấu hình SSH Client với Host Key Verification chặt chẽ
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          
          # Nạp SSH Private Key
          echo "${{ secrets.STAGING_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          # Cấu hình Host Key Verification thông qua secret STAGING_SSH_KNOWN_HOSTS
          # TUYỆT ĐỐI KHÔNG sử dụng StrictHostKeyChecking=no để bảo vệ an ninh chống Man-In-The-Middle
          echo "${{ secrets.STAGING_SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Đồng bộ cấu hình triển khai sang máy chủ Staging
        run: |
          ssh -p ${{ secrets.STAGING_SSH_PORT || 22 }} ${{ secrets.STAGING_SSH_USER }}@${{ secrets.STAGING_SSH_HOST }} \
            "mkdir -p ~/app/deploy/staging/nginx/conf.d ~/app/deploy/staging/scripts"

          scp -P ${{ secrets.STAGING_SSH_PORT || 22 }} -r deploy/staging/* \
            ${{ secrets.STAGING_SSH_USER }}@${{ secrets.STAGING_SSH_HOST }}:~/app/deploy/staging/

          ssh -p ${{ secrets.STAGING_SSH_PORT || 22 }} ${{ secrets.STAGING_SSH_USER }}@${{ secrets.STAGING_SSH_HOST }} \
            "chmod +x ~/app/deploy/staging/scripts/*.sh"

      - name: Kích hoạt triển khai Blue-Green trên máy chủ
        run: |
          ssh -p ${{ secrets.STAGING_SSH_PORT || 22 }} ${{ secrets.STAGING_SSH_USER }}@${{ secrets.STAGING_SSH_HOST }} \
            "export REGISTRY=ghcr.io && \
             export REPO_NAME='${{ github.repository }}' && \
             ~/app/deploy/staging/scripts/deploy.sh '${{ needs.build-and-push.outputs.image_tag }}'"

      - name: Hậu kiểm tra Smoke Test độc lập từ Runner CI
        run: |
          echo "Kiểm tra endpoint readiness từ internet tới Staging: http://${{ secrets.STAGING_SSH_HOST }}/health/ready"
          curl -f --retry 5 --retry-delay 3 "http://${{ secrets.STAGING_SSH_HOST }}/health/ready"
          echo "Staging đã sẵn sàng phục vụ!"
