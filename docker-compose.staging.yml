version: '3.8'

services:
  api:
    image: ghcr.io/${GITHUB_REPOSITORY}:staging
    container_name: event_ticketing_api_staging
    restart: always
    ports:
      - "80:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Staging
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=event_ticketing_staging;Username=postgres;Password=${DB_PASSWORD}
      - Redis__ConnectionString=redis:6379
    depends_on:
      - db
      - redis

  db:
    image: postgres:15-alpine
    container_name: event_ticketing_db_staging
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=event_ticketing_staging
    volumes:
      - pgdata_staging:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: event_ticketing_redis_staging
    restart: always
    volumes:
      - redisdata_staging:/data

volumes:
  pgdata_staging:
  redisdata_staging:
