server {
    listen 80;
    server_name _;

    # Khi có tên miền staging và chứng chỉ SSL (Let's Encrypt / Certbot),
    # mở comment cấu hình chuyển hướng HTTPS bên dưới:
    # return 301 https://$host$request_uri;

    # Endpoint Liveness & Readiness của hệ thống qua Reverse Proxy
    location /health/ {
        proxy_pass http://active_backend/health/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }

    # API Backend
    location /api/ {
        proxy_pass http://active_backend/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # Frontend React Single Page Application
    location / {
        proxy_pass http://active_frontend/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Trang thông báo lỗi thân thiện khi upstream bảo trì hoặc gặp sự cố
    error_page 502 503 504 /custom_50x.html;
    location = /custom_50x.html {
        internal;
        return 503 '{"status": "Error", "message": "Hệ thống đang được nâng cấp hoặc bảo trì phiên bản. Vui lòng thử lại sau giây lát."}';
    }
}

