version: "3.8"

networks:
  staging_net:
    name: ticket_staging_network
    driver: bridge

volumes:
  staging_postgres_data:
    driver: local
  staging_redis_data:
    driver: local

services:
  # ========================================================
  # CSDL PostgreSQL Staging (Tuyệt đối KHÔNG mở port ra ngoài host)
  # ========================================================
  db:
    image: postgres:16.4-alpine3.20
    container_name: staging_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - staging_postgres_data:/var/lib/postgresql/data
    networks:
      - staging_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ========================================================
  # Redis Cache Staging (Tuyệt đối KHÔNG mở port ra ngoài host)
  # ========================================================
  redis:
    image: redis:7.4.0-alpine3.20
    container_name: staging_redis
    restart: always
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - staging_redis_data:/data
    networks:
      - staging_net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s

  # ========================================================
  # Reverse Proxy Nginx (Cửa ngõ duy nhất mở port 80/443 ra ngoài)
  # ========================================================
  proxy:
    image: nginx:1.27.2-alpine
    container_name: staging_proxy
    restart: always
    ports:
      - "${STAGING_HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d
    networks:
      - staging_net
    depends_on:
      - db
      - redis
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3

  # ========================================================
  # Slot BLUE: Backend & Frontend
  # ========================================================
  backend_blue:
    image: ${BACKEND_IMAGE_BLUE:-ghcr.io/ticket/backend:staging}
    container_name: staging_backend_blue
    restart: unless-stopped
    ports:
      - "127.0.0.1:5001:5000"
    environment:
      ASPNETCORE_ENVIRONMENT: Staging
      ConnectionStrings__DefaultConnection: Host=db;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};Timeout=15
      ConnectionStrings__Redis: redis:6379,password=${REDIS_PASSWORD},abortConnect=false
    networks:
      - staging_net
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://127.0.0.1:5000/health/ready || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  frontend_blue:
    image: ${FRONTEND_IMAGE_BLUE:-ghcr.io/ticket/frontend:staging}
    container_name: staging_frontend_blue
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:80"
    networks:
      - staging_net
    depends_on:
      - backend_blue
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://127.0.0.1/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ========================================================
  # Slot GREEN: Backend & Frontend
  # ========================================================
  backend_green:
    image: ${BACKEND_IMAGE_GREEN:-ghcr.io/ticket/backend:staging}
    container_name: staging_backend_green
    restart: unless-stopped
    ports:
      - "127.0.0.1:5002:5000"
    environment:
      ASPNETCORE_ENVIRONMENT: Staging
      ConnectionStrings__DefaultConnection: Host=db;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};Timeout=15
      ConnectionStrings__Redis: redis:6379,password=${REDIS_PASSWORD},abortConnect=false
    networks:
      - staging_net
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://127.0.0.1:5000/health/ready || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  frontend_green:
    image: ${FRONTEND_IMAGE_GREEN:-ghcr.io/ticket/frontend:staging}
    container_name: staging_frontend_green
    restart: unless-stopped
    ports:
      - "127.0.0.1:3002:80"
    networks:
      - staging_net
    depends_on:
      - backend_green
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://127.0.0.1/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
